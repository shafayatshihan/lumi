<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Lumi</title>
<meta name="description" content="Tell Lumi about your talk and Claude builds the slides.">
<link rel="icon" href="/icon.png">
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
<link rel="preload" href="/fonts/Epilogue-Black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/DMSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/cursor.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/studio.css">
<link rel="stylesheet" href="/css/plan.css">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div id="stage" data-mode="full" data-route="loading">
  <div id="char" aria-hidden="true">
    <video id="charVideo" muted playsinline preload="auto" src="/assets/character.mp4"></video>
  </div>

  <div id="brand" aria-label="lumi by Shafayat" data-keepout>
    <span class="word">lumi</span><span class="by">by Shafayat</span>
  </div>

  <div id="topbar">
    <div id="usage" class="usage" hidden role="status" aria-live="polite"></div>
    <button id="sound" class="sound" type="button" aria-pressed="true" hidden data-nosfx data-cursor-label="music">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lbl">music on</span>
    </button>
  </div>

  <div id="netbar" role="alert" hidden><span class="nb-dot" aria-hidden="true"></span><span class="nb-t">can’t reach lumi. trying again…</span><button id="netretry" type="button" data-nosfx>try again now</button></div>

  <section id="loading" class="route" aria-label="getting ready"></section>
  <section id="home" class="route" aria-label="your decks"></section>
  <section id="look" class="route" aria-label="pick a look"></section>
  <section id="start" class="route" aria-label="start a new deck"></section>
  <section id="editor" class="route" aria-label="deck editor"></section>
  <section id="plan" class="route" aria-label="plan your deck"></section>
  <section id="build" class="route" aria-label="build my deck"></section>
  <section id="finalize" class="route" aria-label="finalize"></section>

  <div id="illus"></div>
  <div id="msg" role="alert">
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 17s-6.5-3.8-6.5-8.6A3.6 3.6 0 0 1 10 6.3a3.6 3.6 0 0 1 6.5 2.1C16.5 13.2 10 17 10 17z" fill="#d89cb3"/></svg>
    <span class="msg-text"></span>
  </div>
</div>

<div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="narrow" role="note">
  <svg viewBox="0 0 220 150" width="220" height="150" aria-hidden="true">
    <rect x="34" y="18" width="152" height="98" rx="12" fill="#f7f8fa"/>
    <rect x="48" y="31" width="124" height="72" rx="6" fill="#c9c3ef"/>
    <path d="M18 122h184l-10 12H28z" fill="#9281b0"/>
    <circle cx="96" cy="64" r="6" fill="#080909"/><circle cx="124" cy="64" r="6" fill="#080909"/>
    <path d="M100 82q10 8 20 0" fill="none" stroke="#080909" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 46s-7-4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5-7 9-7 9z" fill="#d89cb3"/>
    <circle cx="196" cy="30" r="5" fill="#f2a65a"/><circle cx="22" cy="54" r="4" fill="#d89cb3"/>
  </svg>
  <p class="n-brand">lumi</p>
  <h1>made for bigger screens</h1>
  <p class="n-text">open lumi on a laptop or desktop. your answers will be waiting.</p>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
